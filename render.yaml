# Free-tier full stack: Neon (DB) + Render (API) + GitHub Pages (frontend)
#
# 1. Create a Neon project and copy the connection string.
# 2. Blueprint / Dashboard → New Web Service from this repo (root = backend Dockerfile).
# 3. Set env vars below (especially DATABASE_URL + CORS_ORIGINS).
# 4. Set GitHub Actions variable VITE_API_BASE_URL to the Render URL, then redeploy Pages.
#
# See docs/FREE_DEPLOY.md for the full walkthrough.

services:
  - type: web
    name: leather-api
    runtime: docker
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://itsumeet27.github.io,http://localhost:5173
      - key: SEED_DATA
        value: "true"
      - key: JPA_DDL_AUTO
        value: update
      - key: FILE_STORAGE_PATH
        value: /tmp/uploads
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0 -Xms128m
