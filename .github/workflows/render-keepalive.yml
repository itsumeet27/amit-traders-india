name: Render keep-alive

# Keeps the free Render API awake by pinging /api/health on a schedule.
# Render free tier spins down after ~15 minutes with no traffic.
# GitHub Actions cron can be delayed, so we ping every 5 minutes and
# allow a long cold-start window.

on:
  schedule:
    # Every 5 minutes (GitHub may delay; tighter interval absorbs lag).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keepalive
  # Do not cancel an in-flight cold-start wake when the next tick arrives.
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake Render API
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL != '' && vars.RENDER_HEALTH_URL || 'https://amit-traders-india-new.onrender.com/api/health' }}
        run: |
          set -euo pipefail
          echo "Pinging $HEALTH_URL at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Cold start on free tier can take 60–120s
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 20 --max-time 60 "$HEALTH_URL" || echo "000")
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json || true
              echo
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != "1" ]; then
            echo "Health check did not return 200 after retries"
            exit 1
          fi
          echo "Keep-alive OK"
