name: Deploy frontend to GitHub Pages

# Publishes the public site to the `gh-pages` branch (legacy Pages source)
# and optionally to GitHub Actions Pages. Set repo variable VITE_API_BASE_URL
# to your Render API origin for seamless live + demo-fallback integration.

on:
  push:
    branches:
      - main
      - cursor/free-deploy-render-neon-7f5b
      - cursor/premium-leather-website-7f5b
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: /amit-traders-india/
          VITE_SITE_URL: https://itsumeet27.github.io/amit-traders-india
          # Hybrid mode: try live Render API, fall back to SAMPLE demo data if asleep
          VITE_DEMO_MODE: 'true'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          python3 <<'PY'
          import os
          api = os.environ.get("VITE_API_BASE_URL") or ""
          site = os.environ.get("VITE_SITE_URL") or "https://itsumeet27.github.io/amit-traders-india"
          content = (
              "window.__APP_CONFIG__ = {\n"
              f'  apiBaseUrl: "{api}",\n'
              f'  siteUrl: "{site}",\n'
              "  demoMode: true\n"
              "};\n"
          )
          open("dist/runtime-config.js", "w", encoding="utf-8").write(content)
          print("runtime-config.js written; apiBaseUrl=", api or "<empty>")
          PY

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
