server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: leather-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leather_db}
    username: ${DB_USERNAME:leather}
    password: ${DB_PASSWORD:leather_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      static-locations: file:${FILE_STORAGE_PATH:./uploads}/

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated origins. For Railway set to your frontend public URL(s).
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}
  file-storage:
    path: ${FILE_STORAGE_PATH:./uploads}
    url-prefix: ${FILE_STORAGE_URL:/uploads}
  seed:
    enabled: ${SEED_DATA:true}
  enquiry:
    min-quantity: 50
  public-base-url: ${PUBLIC_API_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.security: INFO
    com.amittraders.leather: INFO
