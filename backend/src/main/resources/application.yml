server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  application:
    name: leather-api
  autoconfigure:
    # We provide DataSource via DataSourceConfig so DATABASE_URL always wins
    exclude: []
  datasource:
    # Intentionally no hard-coded remote default. Local default only for laptop/dev.
    # On Render, DataSourceConfig reads DATABASE_URL and refuses localhost.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leather_db}
    username: ${DB_USERNAME:leather}
    password: ${DB_PASSWORD:leather_dev_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 20000
      initialization-fail-timeout: 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        # Clearer failure if JDBC metadata is unavailable
        boot:
          allow_jdbc_metadata_access: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      static-locations: file:${FILE_STORAGE_PATH:./uploads}/

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-for-hs256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Include GitHub Pages origin for free-tier (Render + Pages) deploy.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,https://amittradersindia.com,https://www.amittradersindia.com,https://itsumeet27.github.io}
  file-storage:
    path: ${FILE_STORAGE_PATH:./uploads}
    url-prefix: ${FILE_STORAGE_URL:/uploads}
  seed:
    enabled: ${SEED_DATA:true}
  enquiry:
    min-quantity: 50
  public-base-url: ${PUBLIC_API_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
    com.amittraders.leather: INFO
    org.hibernate.orm.jdbc.error: WARN
    com.zaxxer.hikari: INFO
